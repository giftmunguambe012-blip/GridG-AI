<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>GridG AI</title><script src="https://js.puter.com/v2/"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{max-width:400px;margin:auto;background:#fff;min-height:100vh;text-align:center;padding:20px}.logo{width:90px;height:90px;margin:auto;background:conic-gradient(#4285F4 0 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75% 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:55px;color:#fff;font-weight:900}h1{color:#1e3a8a;margin-top:10px}.btn{width:100%;padding:18px;border:0;border-radius:16px;color:#fff;font-size:18px;margin-top:12px}textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:12px;margin-top:15px}#a{text-align:left;background:#f1f5f9;padding:14px;border-radius:12px;margin-top:12px;white-space:pre-wrap;min-height:80px}</style></head><body><div class=logo>G</div><h1>GridG AI</h1><p style="color:#666">Grade 8-11 • CAPS • SA 🇿🇦</p><button class=btn style="background:#2563eb" onclick="speak()">🎤 SPEAK</button><button class=btn style="background:#dc2626" onclick="f.click()">📷 PHOTO</button><input type=file id=f accept=image/* hidden onchange=photo(this)><button class=btn style="background:#111" onclick="q.focus()">⌨️ TYPE</button><textarea id=q rows=3 placeholder="Type homework..."></textarea><button class=btn style="background:#111" onclick="ask()">Ask GridG AI →</button><div id=a>Your answer will appear here...</div><script>async function ask(){let t=q.value;if(!t)return alert('Type question');a.innerText='GridG thinking...';let r=await puter.ai.chat('You are GridG AI SA CAPS tutor Grade 8-11 explain simply with steps: '+t);a.innerText=r.message.content[0].text}function speak(){let R=webkitSpeechRecognition||SpeechRecognition;let s=new R();s.lang='en-ZA';s.onresult=e=>{q.value=e.results[0][0].transcript;ask()};s.start()}async function photo(i){let file=i.files[0];a.innerText='Reading photo...';let rd=new FileReader();rd.onload=async()=>{let r=await puter.ai.chat('Explain this homework for SA CAPS:',rd.result);a.innerText=r.message.content[0].text};rd.readAsDataURL(file)}</script></body></html>
