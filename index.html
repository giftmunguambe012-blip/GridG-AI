<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>GridG INFINITY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0a1e;color:#fff;min-height:100vh}.page{display:none;min-height:100vh;padding-bottom:80px}.page.active{display:block}.cover{height:40vh;background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa,#c4b5fd);display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.g{width:80px;height:80px;background:#fff;color:#7c3aed;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;margin:0 auto 12px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.card{background:#fff;color:#111;border-radius:18px;padding:18px;text-align:center;cursor:pointer}.top{background:#fff;color:#111;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.g2{width:40px;height:40px;background:#7c3aed;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}.content{padding:14px}input,select{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:14px;margin:8px 0}.chat{height:62vh;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.4;white-space:pre-wrap}.me{align-self:flex-end;background:#7c3aed;color:#fff;border-bottom-right-radius:6px}.ai{align-self:flex-start;background:#fff;color:#111;border-bottom-left-radius:6px;border:1px solid #e5e7eb}.row{display:flex;gap:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f0a1e;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #2e1065}.bottom div{color:#a78bfa;font-size:11px;text-align:center;flex:1}.bottom div.active{color:#fff}.onboard{position:fixed;inset:0;background:rgba(15,10,30,.94);z-index:99;display:flex;align-items:center;justify-content:center;padding:18px}.onbox{background:#fff;color:#111;border-radius:20px;padding:20px;max-width:380px;width:100%}button{width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:14px;font-weight:800} .mic{width:52px!important;border-radius:50%!important}</style></head><body>
<div id="onboard" class="onboard" style="display:none"><div class="onbox"><h2 style="text-align:center">♾️ GridG INFINITY</h2><p style="text-align:center;color:#6b7280;font-size:12px">Meta AI style • Knows Everything • Chat Memory</p><label>Name</label><input id="inName" placeholder="Gift"><label>Grade</label><select id="inGrade"><option value="">Choose</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select><button onclick="saveOnboard()" style="margin-top:12px;background:#7c3aed">Start INFINITY ♾️</button></div></div>
