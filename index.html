<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridG AI</title>
<style>
body{font-family:Arial;background:#f0f4ff;margin:0;padding:10px;text-align:center}
.logo{width:80px;height:80px;background:linear-gradient(135deg,#ff0,#f00,#00f,#0f0);border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:40px;color:white}
.card{background:white;border-radius:20px;padding:15px;margin:10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
button{padding:15px;border:none;border-radius:15px;font-size:17px;font-weight:bold;margin:5px;width:90%;cursor:pointer}
#speakBtn{background:#1a4dff;color:white}
#photoBtn{background:#ff1a1a;color:white}
#typeArea{width:90%;padding:15px;border-radius:10px;border:2px solid #1a4dff;font-size:16px}
#answer{background:#e8f0ff;padding:15px;border-radius:10px;min-height:120px;text-align:left;white-space:pre-wrap;margin-top:10px}
</style>
</head>
<body>
<div class="logo">G</div>
<h2>GridG AI</h2><p>Grade 8-11 CAPS Offline</p>
<div class="card">
<button id="speakBtn">🎤 SPEAK</button>
<button id="photoBtn">📸 PHOTO</button>
</div>
<div class="card">
<input id="typeArea" placeholder="Type: photosynthesis or 2x+3=7">
<button onclick="askAI()" style="background:#00c853;color:white;margin-top:10px">ASK AI</button>
<div id="answer">Answer here... Try: photosynthesis</div>
</div>
<script>
const k={
"photosynthesis":"PHOTOSYNTHESIS (Gr10-11)\n6CO2+6H2O+sun->C6H12O6+6O2\nIn chloroplast. Makes food + oxygen!",
"newton 2":"NEWTON 2nd: F=m*a\nForce=mass*accel\nEx: m=5kg a=2 -> F=10N",
"newton":"NEWTON LAWS:\n1: stays still unless force\n2: F=ma\n3: action=reaction",
"pythagoras":"PYTHAGORAS a2+b2=c2\nRight triangle only\nEx: 3,4,5",
"quadratic":"QUADRATIC: x=[-b+-√(b2-4ac)]/2a\nEx: x2+5x+6=0 x=-2,-3",
"2x+3=7":"SOLVE 2x+3=7\n2x=4\nx=2",
"atom":"ATOM: protons+, neutrons0, electrons- in nucleus",
"ecosystem":"ECOSYSTEM: living+nonliving interact",
"fraction":"FRACTION: 1/2+1/3=5/6 make same denominator",
"acid":"ACID pH<7 sour blue->red litmus Ex HCl"
};
function askAI(){
let q=document.getElementById('typeArea').value.toLowerCase();
let a=document.getElementById('answer');
if(!q){a.innerText="Type question!";return}
a.innerText="Thinking...";
setTimeout(()=>{
let r="🤖 GRIDG ANSWER:\n\n";let m=false;
for(let x in k){if(q.includes(x)){r+=k[x];m=true;break}}
if(!m){
if(q.includes("=")||q.includes("x"))r+="MATH: Move numbers one side, divide.\nEx: 2x+3=7 => x=2\nType like 3x+5=20";
else r+="I know: photosynthesis, newton, pythagoras, quadratic, atom, ecosystem, fraction, acid\nYour Q: "+q;
}
r+="\n\n-GridG AI Emalahleni";
a.innerText=r;
if('speechSynthesis' in window){speechSynthesis.speak(new SpeechSynthesisUtterance(r.slice(0,180)))}
},600);
