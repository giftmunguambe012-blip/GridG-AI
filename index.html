<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridG INFINITY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f0a1e;color:#fff}.page{display:none;min-height:100vh;padding-bottom:70px}.active{display:block!important}.cover{height:38vh;background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;text-align:center}.g{width:70px;height:70px;background:#fff;color:#7c3aed;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:0 auto 10px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center}.top{background:#fff;color:#111;padding:10px;display:flex;gap:8px;position:sticky;top:0}.g2{width:36px;height:36px;background:#7c3aed;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}.chat{height:60vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}.b{max-width:85%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}.me{align-self:flex-end;background:#7c3aed;color:#fff}.ai{align-self:flex-start;background:#fff;color:#111}.row{display:flex;gap:6px;padding:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f0a1e;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #333}.bottom div{font-size:11px;text-align:center;color:#a78bfa;flex:1}.bottom.ac{color:#fff}input{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd}button{padding:12px 16px;background:#7c3aed;color:#fff;border:0;border-radius:10px;font-weight:800}#on{position:fixed;inset:0;background:#0f0a1ee6;display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}.box{background:#fff;color:#111;border-radius:16px;padding:18px;width:100%;max-width:340px}</style></head><body>
<div id="on"><div class="box"><h2 style="text-align:center">♾️ INFINITY</h2><input id="nm" placeholder="Name: Gift"><select id="gr" style="width:100%;padding:12px;margin:8px 0;border-radius:10px"><option value="">Grade</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select><button onclick="sv()">Start ♾️</button></div></div>
<div id="p-h" class="page active"><div class="cover"><div><div class="g">∞</div><h2 id="wel">GridG INFINITY</h2><p>Chat like Meta AI • Knows Everything</p></div></div><div class="nav"><div class="card" onclick="sh('a')">💬<b>Chat AI</b></div><div class="card" onclick="sh('v')">📺<b>Video</b></div><div class="card" onclick="sh('p')">📷<b>Photo</b></div><div class="card" onclick="sh('s')">⚙️<b>Settings</b></div></div></div>
<div id="p-a" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>INFINITY Chat</b><button onclick="sh('h')" style="margin-left:auto;width:auto;background:#eee;color:#111">←</button></div><div class="chat" id="ch"><div class="b ai">♾️ Hi! I'm INFINITY like Meta AI! I remember our chat! Ask: Who is first president SA? or Solve 2x+3=7</div></div><div class="row"><input id="q" placeholder="Ask anything..." onkeypress="if(event.key=='Enter')ask()"><button onclick="ask()" id="btn">Send</button></div></div>
<div id="p-v" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Videos</b><button onclick="sh('h')" style="margin-left:auto;width:auto">←</button></div><div style="padding:10px"><div style="background:#fff;padding:10px;border-radius:10px"><b>Algebra</b><div style="position:relative;padding-bottom:56%;background:#000"><iframe src="https://www.youtube.com/embed/kq4HqN6Hk3o" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div></div></div></div>
<div id="p-p" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Photo</b><button onclick="sh('h')" style="margin-left:auto;width:auto">←</button></div><div style="padding:12px;text-align:center"><input type="file" id="f" accept="image/*" onchange="ph(this)" hidden><button onclick="document.getElementById('f').click()">📷 TAKE PHOTO</button><img id="im" style="max-width:100%;margin-top:10px;display:none;border-radius:10px"></div></div>
<div id="p-s" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Settings</b><button onclick="sh('h')" style="margin-left:auto;width:auto">←</button></div><div style="padding:10px"><div style="background:#fff;padding:12px;border-radius:10px"><p id="pr"></p><button onclick="localStorage.clear();location.reload()" style="background:#ef4444;margin-top:8px">Reset</button></div></div></div>
<div class="bottom"><div class="ac" id="b-h" onclick="sh('h')">🏠<br>Home</div><div id="b-a" onclick="sh('a')">💬<br>Chat</div><div id="b-v" onclick="sh('v')">📺<br>Video</div><div id="b-p" onclick="sh('p')">📷<br>Photo</div></div>
<script>
let hs=[{r:'system',c:'You are GridG INFINITY like Meta AI for SA learners, remember chat, concise, step-by-step, emoji'}];
function ck(){let n=localStorage.n;if(!n)document.getElementById('on').style.display='flex';else ap()}
function sv(){let n=document.getElementById('nm').value.trim(),g=document.getElementById('gr').value;if(!n||!g){alert('Enter name+grade');return}localStorage.n=n;localStorage.g=g;document.getElementById('on').style.display='none';ap()}
function ap(){let n=localStorage.n||'Learner',g=localStorage.g||'Grade 9';document.getElementById('wel').innerText='Welcome, '+n+' ♾️';document.getElementById('pr').innerText=n+' • '+g}
function sh(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.bottom div').forEach(e=>e.classList.remove('ac'));let b=document.getElementById('b-'+p);if(b)b.classList.add('ac')}
function add(t,w){let c=document.getElementById('ch'),d=document.createElement('div');d.className='b '+(w=='me'?'me':'ai');d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
async function ask(){let i=document.getElementById('q'),q=i.value.trim();if(!q)return;add(q,'me');i.value='';let b=document.getElementById('btn');b.innerText='...';b.disabled=true;hs.push({r:'user',c:q});let pr=hs.map(h=>h.r+': '+h.c).join('\n')+'\nAnswer.';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(pr)),t=await r.text();if(!t||t.length<4)throw'';if(t.length>900)t=t.slice(0,900)+'...';add(t,'ai');hs.push({r:'assistant',c:t})}catch(e){let o={'first president sa':'Mandela 1994-1999','president sa':'Mandela, Mbeki, Motlanthe, Zuma, Ramaphosa','photosynthesis':'6CO2+6H2O→C6H12O6+O2'},l=q.toLowerCase(),a=null;for(let k in o)if(l.includes(k))a=o[k];if(!a)a='📴 Offline, go online for WORLD BRAIN! I know '+q+' when online.';add('📴 '+a,'ai')}b.innerText='Send';b.disabled=false}
function ph(inp){if(inp.files[0]){let r=new FileReader();r.onload=e=>{document.getElementById('im').src=e.target.result;document.getElementById('im').style.display='block';sh('a');document.getElementById('q').value='Help me solve this homework step by step';ask()};r.readAsDataURL(inp.files[0])}}ck()
</script></body></html>
