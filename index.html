<div id="p-solver" class="page" style="background:#f8fafc"><div class="top"><div class="g2" onclick="showPage('home')">∞</div><b>Photo Solver</b><button onclick="showPage('home')" style="width:auto;margin-left:auto">←</button></div><div class="content"><div style="background:#fff;padding:16px;border-radius:12px;text-align:center;color:#111"><button onclick="document.getElementById('cam').click()" style="background:#111827">📷 TAKE PHOTO</button><button onclick="document.getElementById('gal').click()" style="margin-top:8px">🖼️ GALLERY</button><input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)"><input type="file" id="gal" accept="image/*" style="display:none" onchange="handlePhoto(this)"><img id="prev" style="max-width:100%;border-radius:12px;margin-top:10px;display:none"></div></div></div>
<div id="p-settings" class="page" style="background:#f8fafc"><div class="top"><div class="g2" onclick="showPage('home')">∞</div><b>Settings</b><button onclick="showPage('home')" style="width:auto;margin-left:auto">←</button></div><div class="content"><div style="background:#fff;padding:14px;border-radius:12px;color:#111"><b>Profile</b><p id="prof"></p><button onclick="localStorage.clear();location.reload()" style="background:#ef4444;margin-top:10px">Reset</button></div></div></div>
<div class="bottom"><div class="active" id="b-home" onclick="showPage('home')">🏠<br>Home</div><div id="b-ask" onclick="showPage('ask')">💬<br>Chat</div><div id="b-premium" onclick="showPage('premium')">📺<br>Video</div><div id="b-solver" onclick="showPage('solver')">📷<br>Photo</div></div>
<script>
let history=[{role:'system',content:'You are GridG INFINITY - like Meta AI, for SA CAPS learners Grade 8-12. You remember chat, help step-by-step, know everything worldwide, friendly, concise, emojis.'}];
let lastText='';
function checkOnboard(){let n=localStorage.gridgName;if(!n){document.getElementById('onboard').style.display='flex';}else{applyProfile();}}
function saveOnboard(){let n=document.getElementById('inName').value.trim();let g=document.getElementById('inGrade').value;if(!n||!g){alert('Enter');return;}localStorage.gridgName=n;localStorage.gridgGrade=g;document.getElementById('onboard').style.display='none';applyProfile();}
function applyProfile(){let n=localStorage.gridgName||'Learner';let g=localStorage.gridgGrade||'Grade 9';document.getElementById('welcome').innerText='Welcome, '+n+' ♾️';document.getElementById('gradeShow').innerText=g+' • INFINITY • Knows Everything';document.getElementById('askGrade').innerText='Chat memory • '+g+' • WORLD';document.getElementById('prof').innerText=n+' • '+g;}
function showPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.bottom div').forEach(e=>e.classList.remove('active'));let b=document.getElementById('b-'+p);if(b)b.classList.add('active');}
function addBubble(text,who){let box=document.getElementById('chatBox');let d=document.createElement('div');d.className='bubble '+(who=='me'?'me':'ai');d.innerText=text;box.appendChild(d);box.scrollTop=box.scrollHeight;if(who=='ai')lastText=text;}
function clearChat(){document.getElementById('chatBox').innerHTML='<div class="bubble ai">♾️ Chat cleared! Ask anything new - I still know everything!</div>';history=history.slice(0,1);}
const offline={"first president sa":"🇿🇦 Nelson Mandela 1994-1999 first democratic president, 27 years prison, Nobel 1993","president sa":"SA Presidents: Mandela 94-99, Mbeki 99-08, Motlanthe 08-09, Zuma 09-18, Ramaphosa now","mandela":"Nelson Mandela 1918-2013 father of nation","photosynthesis":"6CO2+6H2O+sun→sugar+O2 in chloroplast","dna":"DNA double helix A-T C-G"};
async function ask(){
 let input=document.getElementById('q');let raw=input.value.trim();if(!raw)return;
 addBubble(raw,'me');input.value='';document.getElementById('askBtn').innerText='Thinking...';document.getElementById('askBtn').disabled=true;
 let grade=localStorage.gridgGrade||'Grade 9';
 history.push({role:'user',content:`Grade ${grade}: ${raw}`});
 let prompt = history.map(h=>h.role+': '+h.content).join('\n') + '\nAnswer as GridG INFINITY friendly, concise, step-by-step if homework, CAPS focus, emoji.';
 try{
  let resp=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt),{method:'GET'});
  let txt=await resp.text();
  if(!txt||txt.length<5) throw new Error();
  if(txt.length>1200) txt=txt.substring(0,1200)+'...\n♾️ (continued)';
  addBubble(txt,'ai');history.push({role:'assistant',content:txt});
 }catch(e){
  let low=raw.toLowerCase();let ans=null;for(let k in offline){if(low.includes(k)) ans=offline[k];}
  if(!ans&&low.includes('first')&&low.includes('president')) ans=offline['first president sa'];
  if(!ans){let m=low.match(/(\d+)x\s*\+\s*(\d+)\s*=\s*(\d+)/);if(m){let a=parseInt(m[1]),b=parseInt(m[2]),c=parseInt(m[3]);ans=`🔢 ${a}x+${b}=${c} → ${a}x=${c-b} → x=${(c-b)/a}`;}}
  if(!ans) ans='📴 Offline (no data). Go online for WORLD BRAIN! I know '+raw+' when online. Offline I know: first president SA, Mandela, photosynthesis, DNA, etc.';
  addBubble('📴 OFFLINE MODE\n'+ans,'ai');
 }
 document.getElementById('askBtn').innerText='Send ♾️';document.getElementById('askBtn').disabled=false;
}
function handlePhoto(i){if(i.files&&i.files[0]){let r=new FileReader();r.onload=e=>{document.getElementById('prev').src=e.target.result;document.getElementById('prev').style.display='block';showPage('ask');document.getElementById('q').value='I took photo of homework, help me solve it step by step';ask();};r.readAsDataURL(i.files[0]);}}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Type instead');return;}let rec=new SR();rec.lang='en-ZA';rec.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;ask();};rec.start();}
checkOnboard();
</script></body></html>
