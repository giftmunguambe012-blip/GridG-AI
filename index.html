<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GridG INFINITY</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0a1e;color:#fff}
.page{display:none;min-height:100vh;padding-bottom:70px}
.active{display:block!important}
.cover{height:40vh;background:linear-gradient(135deg,#4c1d95,#7c3aed);display:flex;align-items:center;justify-content:center;text-align:center}
.g{width:70px;height:70px;background:#fff;color:#7c3aed;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:0 auto 10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center}
.top{background:#fff;color:#111;padding:10px;display:flex;gap:8px;position:sticky;top:0}
.g2{width:36px;height:36px;background:#7c3aed;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.chat{height:60vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:10px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.me{align-self:flex-end;background:#7c3aed;color:#fff}
.ai{align-self:flex-start;background:#fff;color:#111}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f0a1e;display:flex;justify-content:space-around;padding:8px 0}
.bottom div{font-size:11px;color:#a78bfa;text-align:center;flex:1}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:12px;background:#7c3aed;color:#fff;border:0;border-radius:10px;font-weight:800}
#on{position:fixed;inset:0;background:#0f0a1ee6;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.box{background:#fff;color:#111;border-radius:16px;padding:18px;width:100%;max-width:340px}
</style>
</head>
<body>
<div id="on"><div class="box"><h2 style="text-align:center">♾️ INFINITY</h2><input id="nm" placeholder="Your name" style="width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc"><select id="gr" style="width:100%;padding:12px;border-radius:10px"><option>Grade 9</option><option>Grade 8</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select><button onclick="sv()" style="width:100%;margin-top:10px">Start ♾️</button></div></div>
<div id="p-h" class="page active"><div class="cover"><div><div class="g">∞</div><h2 id="wel">INFINITY</h2><p>Chat like Meta AI</p></div></div><div class="nav"><div class="card" onclick="sh('a')">💬 Chat AI</div><div class="card" onclick="sh('v')">📺 Video</div><div class="card" onclick="sh('p')">📷 Photo</div><div class="card" onclick="sh('s')">⚙️ Settings</div></div></div>
<div id="p-a" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>INFINITY Chat</b></div><div class="chat" id="ch"><div class="b ai">♾️ Hi! I remember chat like Meta AI! Ask anything!</div></div><div style="display:flex;gap:6px;padding:8px"><input id="q" placeholder="Ask..." onkeypress="if(event.key=='Enter')ask()"><button onclick="ask()" id="btn">Send</button></div></div>
<div id="p-v" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Videos</b></div><div style="padding:10px"><div style="background:#fff;padding:10px;border-radius:10px"><iframe width="100%" height="200" src="https://www.youtube.com/embed/kq4HqN6Hk3o" frameborder="0" allowfullscreen></iframe></div></div></div>
<div id="p-p" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Photo</b></div><div style="padding:12px;text-align:center"><input type="file" id="f" accept="image/*" onchange="ph(this)" hidden><button onclick="document.getElementById('f').click()">📷 PHOTO</button><img id="im" style="max-width:100%;margin-top:10px;display:none"></div></div>
<div id="p-s" class="page" style="background:#f5f5f7"><div class="top"><div class="g2" onclick="sh('h')">∞</div><b>Settings</b></div><div style="padding:10px"><div style="background:#fff;padding:12px;border-radius:10px"><p id="pr"></p><button onclick="localStorage.clear();location.reload()" style="background:#ef4444;margin-top:8px;width:100%">Reset</button></div></div></div>
<div class="bottom"><div onclick="sh('h')">🏠 Home</div><div onclick="sh('a')">💬 Chat</div><div onclick="sh('v')">📺 Video</div><div onclick="sh('p')">📷 Photo</div></div>
<script>
let hs=[];function ck(){if(!localStorage.n)document.getElementById('on').style.display='flex';else ap()}
function sv(){let n=document.getElementById('nm').value.trim();if(!n)return alert('name');localStorage.n=n;localStorage.g=document.getElementById('gr').value;document.getElementById('on').style.display='none';ap()}
function ap(){document.getElementById('wel').innerText='Welcome '+localStorage.n+' ♾️';document.getElementById('pr').innerText=localStorage.n+' • '+localStorage.g}
function sh(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active')}
function add(t,w){let c=document.getElementById('ch'),d=document.createElement('div');d.className='b '+(w=='me'?'me':'ai');d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
async function ask(){let i=document.getElementById('q'),q=i.value.trim();if(!q)return;add(q,'me');i.value='';let b=document.getElementById('btn');b.innerText='...';hs.push(q);try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)),t=await r.text();add(t,'ai')}catch(e){add('📴 Offline: '+q,'ai')}b.innerText='Send'}
function ph(inp){if(inp.files[0]){let r=new FileReader();r.onload=e=>{document.getElementById('im').src=e.target.result;document.getElementById('im').style.display='block';sh('a')};r.readAsDataURL(inp.files[0])}}ck()
</script>
</body>
</html>
